# Gradle 配置
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 8.7.3 的兼容表只到 compileSdk 35，这里用 36（本机只装了 36），
# 只是关掉那条警告，不影响构建。
android.suppressUnsupportedCompileSdk=36

# Kotlin
kotlin.code.style=official

# ------------------------------------------------------------------
# Gradle 守护进程用哪个 JDK（用 Android Studio 打开时必看）
#
# AS 2026.2 自带的 JBR 是 Java 25，而本项目是 Gradle 8.9 + AGP 8.7.3 +
# Kotlin 1.9.24：Gradle 8.9 只支持 Java 1.8–22，Kotlin 1.9 在 Java 25 上会
# 直接崩（Daemon compilation failed / Unsupported class file major version 69）。
#
# 这里不写 org.gradle.java.home 的绝对路径——那会把别人的机器写死。
# 改用 android/.idea/gradle.xml 里的 gradleJvm=#JAVA_HOME，让 AS 跟随系统
# JAVA_HOME（本机就是 JDK 21），等价效果且不影响 clone 下来的人。
#
# 如果你的 JAVA_HOME 不是 JDK 17/21，或者 AS 仍用 JBR 25，二选一：
#   1) Settings → Build, Execution, Deployment → Build Tools → Gradle → Gradle JDK 选 21；
#   2) 取消下面这行的注释并改成你自己的 JDK 路径（改完要重启 AS）。
# org.gradle.java.home=C:/Program Files/Microsoft/jdk-21.0.9.10-hotspot
# ------------------------------------------------------------------
org.gradle.tooling.parallel=true
